<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1080,initial-scale=1" />
<title>Citeable Meta SMB Creative FR 2026-07-09</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
body {
  background: #09090B;
  color: #F0F0EC;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.card {
  position: relative;
  width: 1080px;
  height: 1080px;
  padding: 72px;
  background:
    radial-gradient(circle at 78% 8%, rgba(202,255,60,0.20), transparent 34%),
    radial-gradient(circle at 12% 92%, rgba(202,255,60,0.13), transparent 32%),
    linear-gradient(145deg, #09090B 0%, #111116 62%, #09090B 100%);
  overflow: hidden;
}
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: radial-gradient(circle at center, rgba(0,0,0,0.65), transparent 70%);
}
.brand { position: relative; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; letter-spacing: -0.04em; }
.beta { border: 1px solid rgba(202,255,60,0.24); background: rgba(202,255,60,0.11); color: #CAFF3C; border-radius: 999px; padding: 12px 18px; font-weight: 900; font-size: 19px; letter-spacing: 0.08em; }
.eyebrow { position: relative; display: inline-flex; align-items: center; gap: 13px; margin-top: 88px; color: #CAFF3C; font-size: 24px; font-weight: 950; letter-spacing: 0.09em; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #CAFF3C; box-shadow: 0 0 28px #CAFF3C; }
h1 { position: relative; margin: 22px 0 0; max-width: 860px; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 84px; line-height: 0.96; letter-spacing: -0.058em; }
.panel { position: relative; margin-top: 54px; border: 1px solid rgba(255,255,255,0.10); border-radius: 34px; background: rgba(17,17,22,0.88); box-shadow: 0 32px 90px rgba(0,0,0,0.38); padding: 34px; }
.prompt { color: #B8B8C4; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.query { margin-top: 12px; color: #F0F0EC; font-size: 34px; line-height: 1.15; font-weight: 950; letter-spacing: -0.035em; }
.results { margin-top: 28px; display: grid; gap: 14px; }
.result { display: flex; align-items: center; justify-content: space-between; min-height: 82px; border-radius: 22px; padding: 0 24px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.075); }
.result strong { font-size: 28px; letter-spacing: -0.03em; }
.pill { border-radius: 999px; padding: 10px 16px; font-size: 20px; font-weight: 950; }
.warn { color: #F0F0EC; background: rgba(255,255,255,0.08); }
.good { color: #09090B; background: #CAFF3C; }
.bottom { position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
.cta { display: inline-flex; align-items: center; justify-content: center; min-width: 310px; border-radius: 999px; background: #CAFF3C; color: #09090B; padding: 24px 34px; font-size: 31px; font-weight: 1000; letter-spacing: -0.035em; box-shadow: 0 0 50px rgba(202,255,60,0.22); }
.foot { color: #C7C7D2; font-size: 26px; font-weight: 850; letter-spacing: -0.025em; }
</style>
</head>
<body>
  <main class="card" aria-label="Citeable ad creative preview">
    <div class="grid"></div>
    <header class="brand">
      <div class="logo">Citeable</div>
      <div class="beta">BETA</div>
    </header>
    <section class="eyebrow"><span class="dot"></span>AUDIT GRATUIT · 60 SEC</section>
    <h1>L’IA recommande-t-elle ton entreprise ?</h1>
    <section class="panel">
      <div class="prompt">Quand un client demande conseil…</div>
      <div class="query">“meilleur commerce près de moi”</div>
      <div class="results">
        <div class="result"><strong>Ton entreprise</strong><span class="pill warn">pas encore citée</span></div>
        <div class="result"><strong>Un concurrent</strong><span class="pill good">cité à ta place</span></div>
      </div>
    </section>
    <footer class="bottom">
      <div class="cta">Audit gratuit →</div>
      <div class="foot">Sans carte · Sans installation</div>
    </footer>
  </main>
</body>
</html>
