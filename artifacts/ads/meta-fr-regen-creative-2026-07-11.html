<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1080,initial-scale=1" />
<title>Citeable Meta FR REGENERATE Creative 2026-07-11</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
body {
  background: #0a0a0a;
  color: #f8fafc;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.creative {
  position: relative;
  width: 1080px;
  height: 1080px;
  padding: 70px;
  overflow: hidden;
  background:
    radial-gradient(circle at 78% 10%, rgba(34,197,94,0.28), transparent 30%),
    radial-gradient(circle at 12% 84%, rgba(34,197,94,0.16), transparent 34%),
    linear-gradient(145deg, #0a0a0a 0%, #111412 52%, #0a0a0a 100%);
}
.creative::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(248,250,252,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(248,250,252,0.045) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: radial-gradient(circle at center, rgba(0,0,0,0.88), transparent 72%);
}
.creative::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(120deg, transparent 0 38%, rgba(34,197,94,0.12) 38% 39%, transparent 39% 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px);
  mix-blend-mode: screen;
  opacity: 0.65;
}
.orb {
  position: absolute;
  right: -170px;
  top: 145px;
  width: 440px;
  height: 440px;
  border-radius: 999px;
  border: 1px solid rgba(34,197,94,0.38);
  box-shadow: inset 0 0 70px rgba(34,197,94,0.12), 0 0 115px rgba(34,197,94,0.17);
}
.wrap { position: relative; z-index: 2; height: 100%; }
.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 32px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -0.05em;
}
.logo-mark {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: #22c55e;
  box-shadow: 0 0 44px rgba(34,197,94,0.36);
}
.geo {
  color: #0a0a0a;
  background: #22c55e;
  border: 1px solid rgba(34,197,94,0.5);
  border-radius: 999px;
  padding: 13px 20px;
  font-size: 18px;
  font-weight: 950;
  letter-spacing: 0.12em;
}
.eyebrow {
  margin-top: 60px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: #86efac;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.pulse {
  width: 13px;
  height: 13px;
  border-radius: 999px;
  background: #22c55e;
  box-shadow: 0 0 0 9px rgba(34,197,94,0.16), 0 0 42px rgba(34,197,94,0.8);
}
h1 {
  max-width: 840px;
  margin: 30px 0 0;
  font-size: 74px;
  line-height: 0.94;
  letter-spacing: -0.055em;
  font-weight: 950;
}
h1 em {
  color: #22c55e;
  font-style: italic;
  text-shadow: 0 0 44px rgba(34,197,94,0.22);
}
.subcopy {
  max-width: 690px;
  margin-top: 22px;
  color: #d1d5db;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 27px;
  line-height: 1.13;
  font-weight: 740;
  letter-spacing: -0.035em;
}
.dashboard {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 118px;
  min-height: 286px;
  border-radius: 34px;
  padding: 26px;
  background: rgba(12,14,13,0.88);
  border: 1px solid rgba(255,255,255,0.11);
  box-shadow: 0 30px 120px rgba(0,0,0,0.58), inset 0 1px rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.dash-head {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: center;
  padding-bottom: 22px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.question {
  color: #f8fafc;
  font-size: 27px;
  line-height: 1.05;
  font-weight: 920;
  letter-spacing: -0.04em;
}
.score {
  width: 156px;
  height: 112px;
  flex: 0 0 auto;
  border-radius: 28px;
  display: grid;
  place-items: center;
  color: #0a0a0a;
  background: linear-gradient(150deg, #22c55e, #a7f3d0);
  box-shadow: 0 0 60px rgba(34,197,94,0.27);
}
.score strong {
  display: block;
  font-size: 42px;
  line-height: 0.9;
  letter-spacing: -0.075em;
}
.score span {
  display: block;
  margin-top: 7px;
  font-size: 13px;
  font-weight: 1000;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.competitors {
  margin-top: 22px;
  display: grid;
  gap: 12px;
}
.competitor {
  min-height: 51px;
  display: grid;
  grid-template-columns: 36px 1fr 94px;
  align-items: center;
  gap: 16px;
  padding: 0 18px;
  border-radius: 18px;
  background: rgba(255,255,255,0.045);
  border: 1px solid rgba(255,255,255,0.06);
}
.rank {
  color: #86efac;
  font-size: 18px;
  font-weight: 1000;
}
.name {
  height: 18px;
  border-radius: 999px;
  filter: blur(4px);
  opacity: 0.66;
  background: linear-gradient(90deg, rgba(255,255,255,0.82), rgba(255,255,255,0.24));
}
.tag {
  color: rgba(248,250,252,0.72);
  font-size: 14px;
  font-weight: 950;
  text-align: right;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.footer {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.cta {
  min-width: 278px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: #22c55e;
  color: #0a0a0a;
  padding: 24px 32px;
  font-size: 30px;
  line-height: 1;
  font-weight: 1000;
  letter-spacing: -0.055em;
  box-shadow: 0 0 60px rgba(34,197,94,0.28);
}
.note {
  color: #d1d5db;
  font-size: 25px;
  line-height: 1.08;
  font-weight: 850;
  letter-spacing: -0.035em;
  text-align: right;
}
</style>
</head>
<body>
  <main class="creative" aria-label="Créa publicitaire Citeable Meta France Belgique Luxembourg">

          <div class="competitor"><span class="rank">#2</span><span class="name" style="width: 72%"></span><span class="tag">cité</span></div>
          <div class="competitor"><span class="rank">#3</span><span class="name" style="width: 61%"></span><span class="tag">visible</span></div>

      <footer class="footer">

</body>
</html>
